name: Lint Code

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install flake8
      - name: Print working directory
        run: pwd
      - name: Run Linter
        run: |
          flake8 --select=F server
          cd server
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Run Django development server
        working-directory: server
        shell: bash
        run: |
          python manage.py migrate --noinput
          python manage.py seed_course_data
          python -u manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django_server.log" 2>&1 &
          server_pid=$!
          sleep 3
          cat "$RUNNER_TEMP/django_server.log"
          grep -q "Starting development server at" "$RUNNER_TEMP/django_server.log"
          kill "$server_pid"
          wait "$server_pid" || true
      - name: Save Django server output
        uses: actions/upload-artifact@v4
        with:
          name: django_server
          path: ${{ runner.temp }}/django_server.log
      - name: Build Docker image
        run: docker build --tag fullstack-developer-capstone:ci .

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install JSHint
        run: npm install --global jshint
      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci
      - name: Run Linter
        working-directory: server/frontend
        run: |
          jshint --config .jshintrc src/api.js vite.config.js
          npm test
          npm run build
  capture-submission:
    name: Capture Submission Evidence
    if: github.ref == 'refs/heads/main'
    needs:
      - lint-python
      - lint-javascript
    runs-on: ubuntu-latest
    env:
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      CAPSTONE_PYTHON_JOB_STATUS: ${{ needs.lint-python.result }}
      CAPSTONE_JS_JOB_STATUS: ${{ needs.lint-javascript.result }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json
      - name: Install backend and browser dependencies
        run: |
          python -m pip install -r server/requirements.txt
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build frontend
        working-directory: server/frontend
        run: |
          npm ci
          npm run build
      - name: Generate ephemeral test account passwords
        shell: bash
        run: |
          python - <<'PY'
          import os
          import secrets

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for key in ("CI_DEMO_PASSWORD", "CI_ROOT_PASSWORD"):
                  value = secrets.token_urlsafe(18)
                  print(f"::add-mask::{value}")
                  env_file.write(f"{key}={value}\n")
          PY
      - name: Migrate, load course records, and create temporary accounts
        working-directory: server
        run: |
          python manage.py migrate --noinput
          python manage.py seed_course_data
          python manage.py shell <<'PY'
          import os
          from django.contrib.auth import get_user_model

          User = get_user_model()
          User.objects.filter(username__in=["root", "capstone-demo"]).delete()
          User.objects.create_superuser(
              "root",
              "root@example.test",
              os.environ["CI_ROOT_PASSWORD"],
          )
          User.objects.create_user(
              "capstone-demo",
              email="demo@example.test",
              password=os.environ["CI_DEMO_PASSWORD"],
              first_name="Capstone",
              last_name="Demo",
          )
          PY
      - name: Start Django server
        working-directory: server
        shell: bash
        run: |
          python -u manage.py runserver 127.0.0.1:8000 --noreload > "$RUNNER_TEMP/django_server.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/django_server.pid"
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/djangoapp/health >/dev/null; then
              break
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/django_server.log"
          curl --silent --show-error --fail http://127.0.0.1:8000/djangoapp/health >/dev/null
      - name: Capture cURL outputs and app screenshots
        env:
          DJANGO_SERVER_LOG: ${{ runner.temp }}/django_server.log
        run: python .github/scripts/capture_submission.py
      - name: Upload submission evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capstone-submission-evidence
          path: submission/
          if-no-files-found: warn
          retention-days: 90

